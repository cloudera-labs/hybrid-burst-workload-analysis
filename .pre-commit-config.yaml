# NOTICE.txt is generated from the FOSSA report. Keep it exactly as generated.
exclude: ^NOTICE\.txt$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: local
    hooks:
      # Fails when a Python or YAML file has no license header. To add the
      # missing headers, run the same command without -check.
      - id: addlicense
        name: check license headers
        language: golang
        additional_dependencies: [github.com/google/addlicense@v1.1.1]
        entry: addlicense -check -f .github/license-header.txt
        types_or: [python, yaml]
      # addlicense does not know the Makefile, so check it by its text.
      - id: makefile-license
        name: check the Makefile license header
        language: pygrep
        entry: 'Licensed under the Apache License, Version 2\.0'
        args: [--negate]
        files: ^Makefile$
